name: Generate Contribution Snake

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: htoomyatmineain
          outputs: |
            dist/contribution-snake.svg?palette=github-light&color_snake=%23800080&color_dots=%23eff2f5,%23aceebb,%234ac26b,%232da44e,%23116b2e
            dist/contribution-snake-dark.svg?palette=github-light&color_snake=%23800080&color_dots=%23eff2f5,%23aceebb,%234ac26b,%232da44e,%23116b2e

      - name: Add a light background for both GitHub themes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path('dist').glob('*.svg'):
              svg = path.read_text()
              match = re.search(r'viewBox="([^"]+)"', svg)
              x, y, width, height = match.group(1).split()
              background = f'<rect x="{x}" y="{y}" width="{width}" height="{height}" rx="12" fill="#ffffff"/>'
              svg = svg.replace('>', '>' + background, 1)
              path.write_text(svg)
          PY

      - name: Publish animations
        uses: crazy-max/ghaction-github-pages@v4.2.0
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
