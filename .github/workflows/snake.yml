name: Generate Contribution Snake

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: htoomyatmineain
          outputs: |
            dist/contribution-snake.svg?palette=github-light&color_snake=%2316a34a&color_dots=%23ebedf0,%239be9a8,%2340c463,%2330a14e,%23216e39
            dist/contribution-snake-dark.svg?palette=github-dark&color_snake=%234ade80&color_dots=%2321262d,%230e4429,%23006d32,%2326a641,%2339d353

      - name: Publish animations
        uses: crazy-max/ghaction-github-pages@v4.2.0
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
